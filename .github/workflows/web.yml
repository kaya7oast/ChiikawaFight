# Builds the browser/phone version with pygbag and publishes it to GitHub Pages
# on every push to main. One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Build web version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pygbag
        run: pip install pygbag
      - name: Build web version
        run: python -m pygbag --build --title "Chiikawa Ball Fight" .
      - name: Fit portrait screen on phones + match background colour
        # pygbag's page is built for 1280x720 landscape games and squashes portrait ones,
        # so add a tiny script that keeps our 540x960 game at the right shape, centred.
        run: |
          python - <<'PYEOF'
          p = "build/web/index.html"
          html = open(p, encoding="utf-8").read()
          style = "<style>html,body{background:linear-gradient(#ffe8f2,#cee6ff) fixed !important;}canvas{outline:none}</style>"
          script = """<script>
          (function(){
            function fitGame(){
              var c = document.getElementById('canvas'); if (!c) return;
              var W = 540, H = 960, vw = window.innerWidth, vh = window.innerHeight;
              var s = Math.min(vw / W, vh / H), w = Math.floor(W * s), h = Math.floor(H * s);
              Object.assign(c.style, {position:'fixed', width:w+'px', height:h+'px',
                left:Math.floor((vw-w)/2)+'px', top:Math.floor((vh-h)/2)+'px', margin:'0', outline:'none'});
            }
            window.addEventListener('resize', function(){ setTimeout(fitGame, 150); });
            window.addEventListener('load', fitGame);
            setInterval(fitGame, 1000);
          })();
          </script>"""
          html = html.replace("</head>", style + "</head>", 1).replace("</body>", script + "</body>", 1)
          open(p, "w", encoding="utf-8").write(html)
          print("patched:", "fitGame" in html)
          PYEOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
